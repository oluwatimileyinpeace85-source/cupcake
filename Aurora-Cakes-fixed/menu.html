<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Aurora Cakes — Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-inner"><a class="logo" href="index.html"><img src="assets/logo4.svg"
                    alt="Aurora Cakes"><span>Aurora Cakes</span></a><button class="nav-toggle" id="navToggle">☰</button>
            <nav class="nav" id="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="trending.html">Trending</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions"><button class="icon-btn" data-link="favorites.html">♡<span class="badge"
                        id="favCount">0</span></button><button class="icon-btn" data-link="cart.html">🛒<span
                        class="badge" id="cartCount">0</span></button><button class="btn"
                    data-link="account.html">Account</button></div>
        </div>
    </header>
    <main class="container">
        <section class="page-hero"><span class="eyebrow">Our menu</span>
            <h1>Pick your sweet spot.</h1>
            <p>Browse what Aurora Cakes has available today. Use search and categories, then add anything you love to
                your cart.</p>
        </section>
        <div class="toolbar"><input class="search" id="productSearch"
                placeholder="Search chocolate, red velvet, vanilla...">
            <div class="filters" id="filters"></div>
        </div>
        <section class="product-grid" id="productGrid"></section>
    </main>
    <div class="modal" id="quickModal">
        <div class="modal-card"><button class="close" id="closeQuick">×</button>
            <div id="quickContent"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
